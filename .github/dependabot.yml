version: 2
updates:
  # GitHub Actions（ワークフロー + composite action）
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # npm / pnpm 依存
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
